name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, "phase-*"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      - run: flutter pub get

      # Informational only: do not block the build on lint or the stale default test.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Test
        run: flutter test
        continue-on-error: true

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --debug -v 2>&1 | tee build.log

      - name: Surface build errors
        if: failure()
        shell: bash
        run: |
          {
            echo "=== ERROR LINES ==="
            grep -n -E "^e: |error:|What went wrong|FAILURE|Execution failed|Could not|not found|Unresolved|Exception" build.log | head -60
            echo "=== TAIL ==="
            tail -60 build.log
          } > summary.txt
          msg=$(python3 -c "import urllib.parse;print(urllib.parse.quote(open('summary.txt').read()[:12000],safe=' /:.,;()[]{}<>=-_\\'\"'))")
          echo "::error title=BUILD-LOG::${msg}"

      - name: Build release APK (debug-signed for now)
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: rcsn-apks
          path: build/app/outputs/flutter-apk/*.apk
