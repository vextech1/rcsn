name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, "phase-*"]

jobs:
  backend:
    name: rules tests and script checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Script syntax check
        shell: bash
        run: |
          node --check functions/index.js

      - name: Storage Worker tests
        run: cd worker && npm install --no-audit --no-fund && npm test

      - name: Rules tests (Firestore emulator)
        shell: bash
        run: |
          set -o pipefail
          (cd rules-tests && npm install --no-audit --no-fund)
          npx -y firebase-tools emulators:exec --only firestore --project demo-rcsn "npm --prefix rules-tests test" 2>&1 | tee rules.log

      - name: Surface rules errors
        if: failure()
        shell: bash
        run: |
          cat rules.log > ci.log 2>/dev/null || true
          .github/scripts/annotate-failure.sh RULES-LOG ci.log

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      - run: flutter pub get

      # Analyze is informational only; the Dart tests below are blocking.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Test
        run: flutter test

      - name: Build release APKs (one per ABI)
        shell: bash
        env:
          # Repository variable: the storage Worker's address (docs/STORAGE.md).
          STORAGE_URL: ${{ vars.STORAGE_URL }}
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi --dart-define="STORAGE_URL=$STORAGE_URL" -v 2>&1 | tee build.log

      - name: Surface build errors
        if: failure()
        shell: bash
        run: |
          # The shared script is the one the rules job uses; the inline
          # version here had broken quoting and itself exited non-zero, so
          # the compile error never reached the annotations.
          cp build.log ci.log
          .github/scripts/annotate-failure.sh BUILD-LOG ci.log

      - uses: actions/upload-artifact@v4
        with:
          name: rcsn-apks
          path: build/app/outputs/flutter-apk/*-release.apk
