name: Seed mock data

# Manual only. Creates (or removes) MOCK staff, tutors, subjects and students in
# the school-msa Firebase project for testing. All mock logins share the
# MOCK_PASSWORD repository secret; the password is never printed.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "seed or cleanup"
        type: choice
        options: [seed, cleanup]
        default: seed

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Write service account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT" || { echo "::error::Secret FIREBASE_SERVICE_ACCOUNT is empty or missing"; exit 1; }
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"

      - name: Install
        run: cd tools && npm install --no-audit --no-fund

      - name: Run
        id: run
        shell: bash
        env:
          MOCK_PASSWORD: ${{ secrets.MOCK_PASSWORD }}
          ACTION: ${{ inputs.action }}
        run: |
          set -o pipefail
          cd tools
          if [ "$ACTION" = "cleanup" ]; then
            node seed-mock-data.js --project school-msa --cleanup 2>&1 | tee ../seed.log
          else
            node seed-mock-data.js --project school-msa 2>&1 | tee ../seed.log
          fi

      - name: Surface errors
        if: failure()
        shell: bash
        run: |
          msg=$(tail -30 seed.log 2>/dev/null | python3 -c "import sys,urllib.parse;print(urllib.parse.quote(sys.stdin.read()[:5000],safe=' /:.,;()[]{}<>=-_'))")
          echo "::error title=SEED-LOG::${msg}"

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"
